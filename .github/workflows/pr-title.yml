# Checks that the pull request's title is a Conventional Commit; it becomes the commit on main.
# What it accepts and what to do when it fails:
# https://github.com/thomaswening/skip-the-fluff/blob/main/docs/development.md#pr-title-check
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
