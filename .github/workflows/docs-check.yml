# Copied from claude-config, skills/project-docs/assets/docs-check.yml.
# What it checks and what to do when it fails:
# https://github.com/thomaswening/skip-the-fluff/blob/main/docs/development.md#docs-check
# Checks every pull request's documents with tools/check_docs.py: links and anchors, ADR
# status, Mermaid diagrams, the requirements' version line, and glossary coverage of the
# files the pull request changes.
name: docs-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the checker diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4 # npx runs mermaid-cli for the Mermaid check
        with:
          node-version: "22"
      - name: Check documents
        # The globs name the code whose links into docs/ and REQ/ADR mentions are checked.
        # Keep them in step with docs/development.md#docs-check.
        run: >-
          python tools/check_docs.py . --base "origin/${{ github.base_ref }}"
          --source "*.kts" "app/*.kts" "gradle/*.toml" "app/src/main/**/*.kt" "app/src/main/**/*.xml" "engine/*.js" "tools/*.mjs"
          --tests "app/src/test/**/*.kt"
          --markdown "fixes/*.md"
          --repo-url "https://github.com/${{ github.repository }}"
