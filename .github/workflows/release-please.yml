# Keeps the release PR (next version and CHANGELOG.md) up to date; merging it creates the release.
# How releases work and what to do when it fails:
# https://github.com/thomaswening/skip-the-fluff/blob/main/docs/development.md#release-please
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Update release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
