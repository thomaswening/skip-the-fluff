# Builds the app's debug APK and runs its tests, and type-checks and tests the fix engine, on every
# pull request and on main. What each job checks and what to do when it fails:
# https://github.com/thomaswening/skip-the-fluff/blob/main/docs/development.md#build-workflow
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft # Microsoft OpenJDK, as on Thomas's computer (ADR-0006)
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle and the libraries between runs
      - name: Build the debug APK and run the tests
        run: ./gradlew assembleDebug testDebugUnitTest
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  engine-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type-check the fix engine
        run: npm run typecheck

  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the engine tests
        run: npm test
      - name: Keep the engine test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: engine/test-results/
